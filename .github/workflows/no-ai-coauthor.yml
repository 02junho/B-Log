name: no-ai-coauthor

# 로컬 훅을 건너뛴 커밋이 올라와도 잡는 2차 안전장치.
# Co-Authored-By 에 AI 도구가 들어간 커밋이 있으면 실패한다.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          PATTERN='^(Co-Authored-By|Co-authored-by|Signed-off-by):.*(claude|anthropic|codex|openai|chatgpt|gpt|copilot|cursor|gemini|google|devin|aider|windsurf|noreply)|Generated with \[?Claude|Generated by (Claude|Codex|Copilot|Cursor)|🤖 Generated'
          BAD=$(git log --format='%H%n%B%n----' $RANGE | grep -Ei -B20 "$PATTERN" | grep -E '^[0-9a-f]{40}$' | sort -u || true)
          if [ -n "$BAD" ]; then
            echo "::error::AI 공동 작성자 트레일러가 포함된 커밋이 있습니다:"
            echo "$BAD"
            echo "git rebase 로 메시지에서 해당 줄을 제거한 뒤 다시 푸시하세요. 로컬 훅 활성화: npm install"
            exit 1
          fi
          echo "OK: AI co-author trailer 없음"
